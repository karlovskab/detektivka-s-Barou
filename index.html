<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detektivka s Bárou</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#111b3c,#34245c);color:#fff;font:18px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(760px,100%);background:#ffffff12;border:1px solid #ffffff30;border-radius:24px;padding:32px;box-shadow:0 20px 60px #0005}h1{color:#ffdc78;margin:0 0 12px}h2{font-size:1.4em}p{line-height:1.5}.muted{color:#d6d5e5}button,input{font:inherit;border-radius:12px;padding:14px}button{border:1px solid #ffffff45;background:#ffffff15;color:white;cursor:pointer;text-align:left}button:hover{background:#ffffff30}button:focus-visible{outline:3px solid #ffdb69}.answers{display:grid;gap:12px;margin:24px 0}.primary{background:#f8ca5c;color:#202039;font-weight:bold;border:0;text-align:center}.primary:hover{background:#ffe08b}.top{display:flex;justify-content:space-between;gap:12px;color:#ffdc78;font-weight:bold}.good{color:#9ff0bb}.bad{color:#ffc1bd}input{width:100%;background:#fff;color:#222;border:0;margin:12px 0 20px}.hidden{display:none}#feedback{min-height:48px}small{color:#ddd}</style></head><body><main class="panel"><div class="top"><span>🕵️ DETEKTIVKA S BÁROU</span><span id="points">0 bodů</span></div><section id="intro"><h1>💻 Zachraň školní počítač!</h1><p>Záhadný digitální vetřelec zamkl školní počítač. Vyřeš 8 misí, nasbírej body a získej titul digitálního detektiva.</p><label for="name">Tvoje detektivní jméno:</label><input id="name" maxlength="30" placeholder="Napiš své jméno"><button class="primary" id="start">🚀 Zahájit misi</button><p><small>Hra funguje bez registrace. Jméno se nikam neposílá.</small></p></section><section id="game" class="hidden"><p class="muted" id="progress"></p><h2 id="question"></h2><div class="answers" id="answers"></div><p id="feedback" aria-live="polite"></p><button class="primary hidden" id="next">Další mise →</button></section><section id="result" class="hidden"><h1>🏆 Mise dokončena!</h1><h2 id="summary"></h2><p id="award"></p><button class="primary" onclick="location.reload()">🔁 Hrát znovu</button></section></main><script>
const missions=[
{q:"Která součást počítače zobrazuje obraz?",a:["Klávesnice","Monitor","Myš"],c:1,why:"Monitor je výstupní zařízení, které zobrazuje obraz."},
{q:"Přišel ti odkaz: Vyhrál jsi mobil, zadej heslo! Co uděláš?",a:["Zadám heslo","Pošlu odkaz kamarádům","Nekliknu a poradím se s dospělým"],c:2,why:"Podezřelé odkazy mohou krást hesla."},
{q:"Které heslo je nejbezpečnější?",a:["123456","Bara2026","M7!qP2#vL9"],c:2,why:"Dlouhá, náhodná a jedinečná hesla jsou bezpečnější."},
{q:"Který soubor bude pravděpodobně fotografie?",a:["vylet.jpg","ukol.mp3","text.txt"],c:0,why:"JPG je běžný formát obrázku."},
{q:"Co je algoritmus?",a:["Přesný postup kroků","Počítačová obrazovka","Druh viru"],c:0,why:"Algoritmus popisuje postup řešení úlohy."},
{q:"Robot stojí směrem na sever. Otočí se doprava, pak znovu doprava. Kam míří?",a:["Na východ","Na jih","Na západ"],c:1,why:"Dvě otočení doprava znamenají otočku o 180 stupňů."},
{q:"Na internetu najdeš překvapivou zprávu. Jak ověříš, zda je pravdivá?",a:["Věřím prvnímu webu","Porovnám více důvěryhodných zdrojů","Počítám lajky"],c:1,why:"Důležité je ověřovat zdroj a porovnat informace."},
{q:"Někdo tě opakovaně uráží v online hře. Co je nejlepší?",a:["Uložím důkazy, zablokuji ho a řeknu dospělému","Začnu mu nadávat","Pošlu mu svoji adresu"],c:0,why:"Při kyberšikaně pomůže bezpečná reakce a dospělý."}
];let i=0,score=0,player="Detektiv";const el=id=>document.getElementById(id);el("start").onclick=()=>{player=el("name").value.trim()||"Detektiv";el("intro").classList.add("hidden");el("game").classList.remove("hidden");show()};function show(){const m=missions[i];el("progress").textContent="Mise "+(i+1)+" z "+missions.length;el("question").textContent=m.q;el("feedback").textContent="";el("next").classList.add("hidden");el("answers").replaceChildren();m.a.forEach((answer,j)=>{let b=document.createElement("button");b.textContent=String.fromCharCode(65+j)+". "+answer;b.onclick=()=>choose(j);el("answers").append(b)})}function choose(j){const m=missions[i];for(const b of el("answers").children)b.disabled=true;if(j===m.c){score+=10;el("feedback").className="good";el("feedback").textContent="✅ Správně! +10 bodů. "+m.why}else{el("feedback").className="bad";el("feedback").textContent="❌ Správná odpověď: "+m.a[m.c]+". "+m.why}el("points").textContent=score+" bodů";el("next").textContent=i===missions.length-1?"Zobrazit výsledek 🏆":"Další mise →";el("next").classList.remove("hidden")}el("next").onclick=()=>{i++;if(i<missions.length)show();else{el("game").classList.add("hidden");el("result").classList.remove("hidden");el("summary").textContent=player+", získáváš "+score+" z 80 bodů!";el("award").textContent=score>=70?"Titul: MISTR DIGITÁLNÍ DETEKTIV 🥇":score>=40?"Titul: DIGITÁLNÍ PÁTRAČ 🥈":"Titul: DETEKTIV ZAČÁTEČNÍK 🔍"}};</script></body></html>
